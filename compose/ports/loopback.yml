# Порты инфраструктуры на loopback хоста: psql, clickhouse-client, консоль
# MinIO и мониторинг NATS с самой машины. Включается PLC_INFRA_PORTS=loopback
# в .env. Наружу (0.0.0.0) не публикуется намеренно: реквизиты у
# инфраструктуры из .env, а её защита -- сеть compose, а не пароли.
services:
  nats:
    ports:
      - "127.0.0.1:4222:4222"   # клиенты
      - "127.0.0.1:8222:8222"   # мониторинг: /healthz, /varz, /connz
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  clickhouse:
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9000:9000"   # native
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  redis-internal:
    ports:
      - "127.0.0.1:6380:6379"
  minio:
    ports:
      - "127.0.0.1:9002:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # консоль
