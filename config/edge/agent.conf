# Конфиг агента ноды. Путь — WAF_AGENT_CONFIG, на стенде /etc/waf/agent.conf.
#
# Окружение перекрывает файл: три контейнера держат один файл, а WAF_NODE_ID
# у каждого свой. Реквизиты S3 в файл не кладём — у них свой секрет и режим.

node {
    # id задаёт WAF_NODE_ID: один файл на три ноды стенда.
    key          /run/secrets/waf_node_key
    data         /var/lib/waf/agent
    heartbeat    4s
    verdict_sock /var/run/waf/verdict.sock

    # Второй сокет ноды: строки access_log и error_log, которые nginx кладёт
    # туда своим syslog-писателем (deploy/nginx/nginx.conf). Агент разбирает
    # шапку и публикует пачки в WAF_LOG, логгер кладёт их в waf.log.
    #
    # off выключает приёмник целиком -- на ноде, где логи собирает кто-то
    # другой, лишний сокет в /var/run/waf только путает.
    log_sock /var/run/waf/log.sock
}

nats {
    url nats://nats:4222
}

# Два Redis, две роли, одна форма на весь контур -- тот же блок стоит в
# inspector.conf у инспекторов. url -- общий обменник: объекты запроса, которые
# модуль кладёт по локатору (waf_store), а архив забирает после вердикта.
# internal -- внутренний Redis контура: всё остальное, здесь -- блобы
# поколения nginx от контроллера (waf.blob.<sha256>). Пусто -- блобы читаются
# из обменника. Окружение: WAF_REDIS_URL и WAF_REDIS_INTERNAL_URL.
redis {
    url      redis://redis:6379
    internal redis://redis-internal:6379
}

# Адрес, регион и бакеты архива, как и темп выгрузки ниже, может перекрыть
# контроллер: KV policy/agent-conf, страница «Конфигурация → Агент»
# (docs/config-distribution.md#настройки-агента). Здесь -- то, с чем нода
# поднимается, и то, что остаётся, если контроллер про ключ молчит.
# Реквизиты не перекрываются никогда: у них свой секрет и свой режим.
s3 {
    endpoint    http://minio:9000
    region      us-east-1
    credentials /run/secrets/waf_s3_creds

    # Три бакета — разная чувствительность, разные правила удаления.
    # Пустой вид в записи станет archive_error, а не тишиной.
    bucket headers waf-headers
    bucket args    waf-args
    bucket body    waf-bodies
}

archive {
    workers 4
    queue   1024
    timeout 5s

    # Корзины по видам. S3 не умеет PutObjects, поэтому «batch» здесь —
    # накопить объекты секции и вспышкой сделать N обычных PUT.
    # Секции не ждут друг друга: headers могут уехать, пока body ещё копится.
    # Запись аудита публикуется, когда уедут все её секции.
    #
    # off            — сразу, как раньше
    # size=N         — вспышка, когда в корзине N объектов
    # timeout=D      — вспышка, если с первого объекта в корзине прошло D
    # оба сразу      — что раньше сработает
    #
    # Тело тяжелее заголовков, корзина короче.
    batch headers size=32 timeout=50ms
    batch args    size=32 timeout=50ms
    batch body    size=8  timeout=100ms
}

nginx {
    bin       nginx
    conf_dir  /etc/nginx
    store_dir /var/lib/waf/store
}
