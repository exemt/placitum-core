# Node agent configuration (WAF_AGENT_CONFIG). Environment variables override it.

node {
    key          /run/secrets/waf_node_key
    data         /var/lib/waf/agent
    heartbeat    4s
    verdict_sock /var/run/waf/verdict.sock

    # Receiver for nginx access and error logs; off disables it.
    log_sock /var/run/waf/log.sock
}

nats {
    url nats://nats:4222
}

# url: request objects for inspection; internal: configuration blobs and inspector state.
redis {
    url      redis://redis:6379
    internal redis://redis-internal:6379
}

# The controller can override endpoint, region and buckets, never the credentials.
s3 {
    endpoint    http://minio:9000
    region      us-east-1
    credentials /run/secrets/waf_s3_creds

    bucket headers waf-headers
    bucket args    waf-args
    bucket body    waf-bodies
}

archive {
    workers 4
    queue   1024
    timeout 5s

    # Upload batching per kind: size=N, timeout=D, both (whichever comes first) or off.
    batch headers size=32 timeout=50ms
    batch args    size=32 timeout=50ms
    batch body    size=8  timeout=100ms
}

nginx {
    bin       nginx
    conf_dir  /etc/nginx
    store_dir /var/lib/waf/store
}
