# Single NATS server with JetStream.

server_name: waf-nats-1
listen: 0.0.0.0:4222

# Monitoring; the container healthcheck uses /healthz.
http: 0.0.0.0:8222

jetstream {
    store_dir: /data
    max_memory_store: 256MB
    max_file_store: 1GB
}

# Inline request bodies are limited by this, not by waf_body_limit.
max_payload: 1MB

debug: false
trace: false
logtime: true
