# Один узел NATS для локальной отладки. Кластер и TLS появятся тогда же, когда
# появится реальный клиент шины; сейчас важна только доступность 4222 и
# JetStream, на котором держится аудит; наборы данных ездят core NATS от
# keeper (docs/keeper.md).

server_name: waf-nats-1
listen: 0.0.0.0:4222

# Порт мониторинга. Он же используется healthcheck-ом контейнера: /healthz
# отвечает 200 только после того, как поднят JetStream.
http: 0.0.0.0:8222

jetstream {
    # Подкаталог jetstream сервер добавляет сам, поэтому здесь корень тома.
    store_dir: /data
    max_memory_store: 256MB
    max_file_store: 1GB
}

# Верхняя граница размера сообщения. Держать её осмысленной нужно с самого
# начала: инлайн тела запроса упирается именно в неё, а не в waf_body_limit, и
# превышение выясняется на проде под нагрузкой, если не задать здесь.
max_payload: 1MB

debug: false
trace: false
logtime: true
